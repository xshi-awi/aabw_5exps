<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Regime shift in Southern Ocean water mass transformation</title>
  <desc>Two-panel schematic comparing interglacial thermal-dominated dense water formation with glacial haline-dominated formation.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .tt { font-size: 15px; font-weight: 500; fill: #2C2C2A; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="600" fill="#FFFFFF"/>

  <text class="tt" x="170" y="28" text-anchor="middle">Interglacial regime</text>
  <text class="ts" x="170" y="46" text-anchor="middle">PI · MH · LIG — thermally dominated</text>
  <text class="tt" x="510" y="28" text-anchor="middle">Glacial regime</text>
  <text class="ts" x="510" y="46" text-anchor="middle">LGM · MIS3 — halinely dominated</text>
  <line x1="340" y1="60" x2="340" y2="585" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

  <!-- Atmosphere: westerlies -->
  <rect x="20" y="65" width="300" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" opacity="0.55"/>
  <text class="ts" x="170" y="84" text-anchor="middle" fill="#0C447C">Westerlies (moderate)</text>
  <line x1="40"  y1="108" x2="120" y2="108" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowSmall)"/>
  <line x1="140" y1="108" x2="200" y2="108" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowSmall)"/>
  <line x1="220" y1="108" x2="280" y2="108" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrowSmall)"/>

  <rect x="360" y="65" width="300" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" opacity="0.55"/>
  <text class="ts" x="510" y="84" text-anchor="middle" fill="#0C447C">Westerlies (intensified)</text>
  <line x1="380" y1="108" x2="490" y2="108" stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="108" x2="620" y2="108" stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Heat-loss arrows -->
  <line x1="80"  y1="175" x2="80"  y2="135" stroke="#A32D2D" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowSmall)"/>
  <line x1="170" y1="175" x2="170" y2="135" stroke="#A32D2D" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowSmall)"/>
  <line x1="260" y1="175" x2="260" y2="135" stroke="#A32D2D" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowSmall)"/>
  <rect x="100" y="148" width="140" height="16" fill="#FFFFFF" opacity="0.92"/>
  <text class="ts" x="170" y="160" text-anchor="middle" fill="#A32D2D">strong heat loss</text>

  <line x1="380" y1="175" x2="380" y2="135" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" opacity="0.35" marker-end="url(#arrowSmall)"/>
  <line x1="510" y1="175" x2="510" y2="135" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" opacity="0.35" marker-end="url(#arrowSmall)"/>
  <line x1="620" y1="175" x2="620" y2="135" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" opacity="0.35" marker-end="url(#arrowSmall)"/>
  <rect x="438" y="148" width="144" height="16" fill="#FFFFFF" opacity="0.92"/>
  <text class="ts" x="510" y="160" text-anchor="middle" fill="#A32D2D" opacity="0.65">heat loss blocked</text>

  <!-- Sea ice + ocean strips -->
  <rect x="20" y="180" width="300" height="40" rx="4" fill="#1D9E75" opacity="0.18" stroke="#0F6E56" stroke-width="0.5"/>
  <rect x="20" y="180" width="60"  height="40" rx="4" fill="#FFFFFF" opacity="0.85" stroke="#888780" stroke-width="0.5"/>
  <rect x="260" y="180" width="60" height="40" rx="4" fill="#FFFFFF" opacity="0.85" stroke="#888780" stroke-width="0.5"/>
  <text class="ts" x="170" y="205" text-anchor="middle" fill="#085041">Open Southern Ocean</text>
  <text class="ts" x="50"  y="205" text-anchor="middle" fill="#444441">ice</text>
  <text class="ts" x="290" y="205" text-anchor="middle" fill="#444441">ice</text>

  <rect x="360" y="180" width="300" height="40" rx="4" fill="#FFFFFF" opacity="0.95" stroke="#888780" stroke-width="0.5"/>
  <rect x="480" y="180" width="80"  height="40" rx="4" fill="#E6F1FB" opacity="0.95" stroke="#185FA5" stroke-width="0.5"/>
  <rect x="560" y="180" width="100" height="40" rx="4" fill="#1D9E75" opacity="0.18" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="ts" x="415" y="198" text-anchor="middle" fill="#444441">Expanded sea ice</text>
  <text class="ts" x="415" y="213" text-anchor="middle" fill="#444441">(insulating lid)</text>
  <text class="ts" x="520" y="205" text-anchor="middle" fill="#0C447C">polynya</text>
  <text class="ts" x="610" y="205" text-anchor="middle" fill="#085041">open ocean</text>

  <!-- Symmetric driver arrows -->
  <line x1="170" y1="222" x2="170" y2="258" stroke="#A32D2D" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="ts" x="215" y="243" fill="#A32D2D">surface cooling</text>

  <line x1="510" y1="222" x2="510" y2="258" stroke="#1D9E75" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="ts" x="555" y="243" fill="#0F6E56">brine rejection</text>

  <!-- Surface buoyancy forcing -->
  <rect x="20" y="265" width="300" height="115" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="170" y="285" text-anchor="middle" fill="#0F6E56">Surface buoyancy forcing</text>
  <rect x="35"  y="305" width="150" height="24" rx="4" fill="#A32D2D" opacity="0.85"/>
  <text x="110" y="321" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="500">Thermal · heat loss</text>
  <rect x="190" y="305" width="55"  height="24" rx="4" fill="#0F6E56" opacity="0.45"/>
  <text x="217" y="321" text-anchor="middle" fill="#000000" font-size="11">Haline</text>
  <rect x="250" y="305" width="55"  height="24" rx="4" fill="#888780" opacity="0.4"/>
  <text x="277" y="321" text-anchor="middle" fill="#000000" font-size="10">P−E+R</text>
  <text class="ts" x="170" y="365" text-anchor="middle" fill="#0F6E56">SAM+ → enhanced heat loss</text>

  <rect x="360" y="265" width="300" height="115" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="510" y="285" text-anchor="middle" fill="#0F6E56">Surface buoyancy forcing</text>
  <rect x="375" y="305" width="55"  height="24" rx="4" fill="#A32D2D" opacity="0.4"/>
  <text x="402" y="321" text-anchor="middle" fill="#000000" font-size="11">Thermal</text>
  <rect x="435" y="305" width="150" height="24" rx="4" fill="#0F6E56" opacity="0.85"/>
  <text x="510" y="321" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="500">Haline · brine rejection</text>
  <rect x="590" y="305" width="55"  height="24" rx="4" fill="#888780" opacity="0.4"/>
  <text x="617" y="321" text-anchor="middle" fill="#000000" font-size="10">P−E+R</text>
  <text class="ts" x="510" y="365" text-anchor="middle" fill="#0F6E56">SAM+ → amplified brine rejection</text>

  <!-- Dense water formation (arrow weight encodes formation rate) -->
  <line x1="170" y1="380" x2="170" y2="410" stroke="#534AB7" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="510" y1="380" x2="510" y2="410" stroke="#534AB7" stroke-width="1.5" opacity="0.5" marker-end="url(#arrow)"/>

  <rect x="40" y="415" width="260" height="58" rx="8" fill="#EEEDFE" stroke="#3C3489" stroke-width="0.5"/>
  <text class="th" x="170" y="441" text-anchor="middle" fill="#3C3489">Dense water formation</text>
  <text class="ts" x="170" y="459" text-anchor="middle" fill="#534AB7" font-weight="600">higher rate</text>

  <rect x="380" y="415" width="260" height="58" rx="8" fill="#EEEDFE" stroke="#3C3489" stroke-width="0.5"/>
  <text class="th" x="510" y="441" text-anchor="middle" fill="#3C3489">Dense water formation</text>
  <text class="ts" x="510" y="459" text-anchor="middle" fill="#9590C9">slower rate</text>

  <!-- Ventilation age -->
  <line x1="170" y1="473" x2="170" y2="503" stroke="#534AB7" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="510" y1="473" x2="510" y2="503" stroke="#534AB7" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="508" width="260" height="62" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="th" x="170" y="528" text-anchor="middle" fill="#854F0B">Deep ventilation age</text>
  <text class="ts" x="170" y="546" text-anchor="middle" fill="#BA7517">Atlantic / Indian &lt; 500 yr</text>
  <text class="ts" x="170" y="561" text-anchor="middle" fill="#BA7517">Pacific ≈ 800 yr</text>

  <rect x="380" y="508" width="260" height="62" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="th" x="510" y="528" text-anchor="middle" fill="#854F0B">Deep ventilation age</text>
  <text class="ts" x="510" y="546" text-anchor="middle" fill="#BA7517">basin-wide &gt; 750 yr</text>
  <text class="ts" x="510" y="561" text-anchor="middle" fill="#BA7517">Pacific ≈ 1500 yr</text>

</svg>
